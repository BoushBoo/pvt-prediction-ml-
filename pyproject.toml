[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "pvt-ml"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.4", "matplotlib>=3.7", "xlrd>=2.0", "openpyxl>=3.1"]
[project.optional-dependencies]
boosting = ["xgboost>=2.0", "catboost>=1.2"]
neural = ["tensorflow-cpu>=2.16,<2.21"]
notebook = ["jupyterlab>=4", "ipykernel>=6"]
test = ["pytest>=7", "xlwt>=1.3"]
[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
pvt-experiment = "pvt_ml.__main__:main"
